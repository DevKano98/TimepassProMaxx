services:
  # ---------------------------------------------------------
  # 1. CivicGuard FastAPI Backend Service
  # ---------------------------------------------------------
  - type: web
    name: civicguard-api
    env: docker
    plan: free
    dockerfilePath: backend/api/Dockerfile
    dockerContext: backend/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_ADMIN_EMAIL
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org/search
      - key: ORS_API_KEY
        sync: false
      - key: OPEN_METEO_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: ANON_REPORT_DAILY_LIMIT
        value: "3"
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: INTERNAL_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: civicguard-ml
          property: host
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FIELD_APP_ORIGIN
        sync: false

  # ---------------------------------------------------------
  # 2. CivicGuard Computer Vision (YOLO11s) Service
  # ---------------------------------------------------------
  - type: web
    name: civicguard-ml
    env: docker
    plan: free
    dockerfilePath: backend/ml-service/Dockerfile
    dockerContext: backend/ml-service
    healthCheckPath: /health
    envVars:
      - key: YOLO_WEIGHTS_PATH
        value: /app/models/best.pt
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: ALLOW_DUMMY_MODEL
        value: "false"

  # ---------------------------------------------------------
  # 3. CivicGuard React Web App (Static Site)
  # ---------------------------------------------------------
  - type: web
    name: civicguard-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: civicguard-api
          property: host
